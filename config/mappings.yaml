  - {id: mood_formal, feature: color_mood, values: [formal, sharp, austere, modern], motifs: [ceremony, edge], function: obligation, rationale: "A hard, cool or neutral palette reads as formal."}
  - {id: mood_dramatic, feature: color_mood, values: [dramatic, bold, vibrant], motifs: [stage, flare], function: rupture, rationale: "A hard, warm or vivid palette reads as dramatic."}
  - {id: mood_quiet, feature: color_mood, values: [chic, understated, calm, natural, serene, airy], motifs: [hush, ease], function: renewal, rationale: "A soft or close-valued palette reads as quiet."}
  - {id: mood_earthy, feature: color_mood, values: [earthy, classic, romantic, gentle], motifs: [soil, memory], function: memory, rationale: "A warm, medium or soft palette reads as earthy or tender."}
  - {id: mood_composed, feature: color_mood, values: [crisp, composed], motifs: [order, breath], function: obligation, rationale: "A cool, medium palette reads as composed."}
  - {id: mood_restless, feature: color_mood, values: [restless], motifs: [unrest, motion], function: rupture, rationale: "Clashing colours read as restless."}
  - {id: surface_plain, feature: texture, values: [plain], motifs: [stillness, clear ground], function: renewal, rationale: "Plain fabric leaves room around the other details.", weight: 0.2}
  - {id: surface_busy, feature: texture, values: [busy, textured], motifs: [murmur, crowd], function: memory, rationale: "A busy surface keeps many small marks at once."}
  - {id: pattern_striped, feature: texture, values: [striped], motifs: [rhythm, direction], function: movement, rationale: "Stripes repeat like steps in one direction."}
  - {id: pattern_checked, feature: texture, values: [checked], motifs: [grid, order], function: obligation, rationale: "Checks lay a grid over the surface."}
  - {id: pattern_dotted, feature: texture, values: [dotted], motifs: [scatter, play], function: renewal, rationale: "Dots scatter small, repeated lights."}
  - {id: pattern_floral, feature: texture, values: [floral print], motifs: [bloom, season], function: renewal, rationale: "An organic print brings growth onto the fabric."}
  - {id: pattern_geometric, feature: texture, values: [geometric print], motifs: [structure, code], function: obligation, rationale: "Geometric shapes read as a code on the surface."}
  - {id: pattern_graphic, feature: texture, values: [graphic print], motifs: [emblem, message], function: memory, rationale: "A single graphic carries a message."}
combinations:
  - {id: tension_dark_reflection, all: [color_dark, surface_metallic], between: [concealment, reflection], description: "What is hidden is interrupted by a glint."}
  - {id: tension_structure_wear, all: [silhouette_structured, condition_worn], between: [order, memory], description: "A deliberate line meets visible wear."}
  - {id: tension_pale_heavy, all: [color_pale, material_leather], between: [threshold, endurance], description: "An opening meets the weight of travel."}
  - {id: tension_layers_sheer, all: [silhouette_layered, texture_soft], between: [concealment, permeability], description: "Layers invite a view through them."}
synonyms:
  charcoal: dark
  dark grey: dark
  gray: grey
  loose-fitting: loose
  oversized fit: oversized
  tailored fit: tailored
  distressed: worn
  reflective: reflective
