  - {id: harmony_clashing, feature: color_harmony, values: [clashing], motifs: [friction, defiance], function: rupture, rationale: "Ou and Luo's harmony model rates the colour pairs as clashing.", weight: 2}
  - {id: temperature_warm, feature: color_temperature, values: [warm], motifs: [hearth, nearness], function: protection, rationale: "Warm hues draw the scene closer."}
